[package]
name = "openplay"
version = "0.1.0"
description = "OpenPlay widget-based game launcher"
authors = ["OpenPlay"]
edition = "2021"

[lib]
name = "openplay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
